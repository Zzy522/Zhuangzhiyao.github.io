      /* ========================================================================
         根组件: AcademicPortfolioApp (集中管理状态、副作用清理与 Memo 渲染树)
         ======================================================================== */
      function AcademicPortfolioApp() {
        const [lang, setLang] = useState(() => {
          const saved = localStorage.getItem('zzy-language');
          if (saved === 'en' || saved === 'zh') return saved;
          return new URLSearchParams(window.location.search).get('lang') === 'en' ? 'en' : 'zh';
        });

        const [theme, setTheme] = useState(() => {
          const saved = localStorage.getItem('zzy-theme');
          if (saved === 'dark' || saved === 'light') return saved;
          return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        });

        const [activeSection, setActiveSection] = useState('about');

        const handleToggleLang = useCallback(() => {
          setLang((prev) => (prev === 'zh' ? 'en' : 'zh'));
        }, []);

        const handleToggleTheme = useCallback(() => {
          setTheme((prev) => (prev === 'dark' ? 'light' : 'dark'));
        }, []);

        const handleSelectSection = useCallback((sectionId) => {
          setActiveSection(sectionId);
        }, []);

        /* 副作用 1: 同步 DOM 根节点语言与标题，包含卸载清理 */
        useEffect(() => {
          const root = document.documentElement;
          root.lang = lang === 'zh' ? 'zh-CN' : 'en';
          document.title =
            lang === 'zh'
              ? '庄智尧 | AI4S · AIDD · 科研智能体'
              : 'Zhuang Zhiyao | AI4S · AIDD · Scientific Agents';
          localStorage.setItem('zzy-language', lang);
          return () => {};
        }, [lang]);

        /* 副作用 2: 同步主题属性与系统级配色监听，严格清理事件监听器 */
        useEffect(() => {
          const root = document.documentElement;
          root.dataset.theme = theme;
          localStorage.setItem('zzy-theme', theme);

          const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
          const handleSystemThemeChange = (event) => {
            if (!localStorage.getItem('zzy-theme')) {
              setTheme(event.matches ? 'dark' : 'light');
            }
          };

          mediaQuery.addEventListener('change', handleSystemThemeChange);
          return () => {
            mediaQuery.removeEventListener('change', handleSystemThemeChange);
          };
        }, [theme]);

        /* 副作用 3: IntersectionObserver 自动追踪当前阅读章节，卸载时严格 disconnect */
        useEffect(() => {
          const sectionIds = ACADEMIC_DATA.nav.map((item) => item.id);
          const targets = sectionIds
            .map((id) => document.getElementById(id))
            .filter(Boolean);

          if (targets.length === 0 || !('IntersectionObserver' in window)) {
            return () => {};
          }

          const observer = new IntersectionObserver(
            (entries) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting) {
                  setActiveSection(entry.target.id);
                }
              });
            },
            { rootMargin: '-15% 0px -70% 0px', threshold: 0.05 }
          );

          targets.forEach((el) => observer.observe(el));

          return () => {
            observer.disconnect();
          };
        }, []);

        /* 使用 useMemo 缓存各板块列表节点，避免主题或导航高亮变化时重算内容节点 */
        const introContent = useMemo(() => {
          return h(
            'section',
            { id: 'about', className: 'intro-block' },

            h('div', { className: 'metrics-strip' }, ACADEMIC_DATA.intro.metrics[lang])
          );
        }, [lang]);

        const newsListNodes = useMemo(() => {
          return h(
            'ul',
            { className: 'record-list' },
            ACADEMIC_DATA.news.map((item) =>
              h(
                'li',
                { key: item.id, className: 'record-row-wrapper' },
                h(
                  'div',
                  { className: 'row-standard' },
                  h('span', { className: 'cell-time' }, item.date),
                  h(
                    'div',
                    { className: 'cell-body' },
                    item.href
                      ? h(
                          'a',
                          { href: item.href, target: '_blank', rel: 'noreferrer' },
                          item[lang]
                        )
                      : h('p', null, item[lang])
                  )
                )
              )
            )
          );
        }, [lang]);

        const publicationListNodes = useMemo(() => {
          return h(
            'ul',
            { className: 'record-list' },
            ACADEMIC_DATA.publications.map((pub) => {
              const venueText = typeof pub.venue === 'string' ? pub.venue : pub.venue[lang];
              return h(
                'li',
                { key: pub.id, className: 'record-row-wrapper' },
                h(
                  'div',
                  { className: 'row-publication' },
                  h('span', { className: 'cell-time' }, pub.year),
                  h(
                    'div',
                    { className: 'cell-body' },
                    h(
                      'h3',
                      { className: 'pub-title' },
                      h(
                        'a',
                        { href: pub.url, target: '_blank', rel: 'noreferrer' },
                        pub.title[lang]
                      )
                    ),
                    h(
                      'p',
                      { className: 'pub-meta' },
                      `${venueText} · `,
                      h('strong', null, pub.role[lang])
                    )
                  ),
                  h(
                    'a',
                    {
                      className: 'pub-action',
                      href: pub.actionUrl,
                      target: '_blank',
                      rel: 'noreferrer'
                    },
                    `[${pub.actionLabel}]`
                  )
                )
              );
            })
          );
        }, [lang]);

        const researchListNodes = useMemo(() => {
          return h(
            'ul',
            { className: 'record-list' },
            ACADEMIC_DATA.research.map((item) =>
              h(
                'li',
                { key: item.id, className: 'record-row-wrapper' },
                h(
                  'div',
                  { className: 'row-labeled' },
                  h('span', { className: 'cell-label' }, item.label[lang]),
                  h('div', { className: 'cell-body' }, h('p', null, item.desc[lang]))
                )
              )
            )
          );
        }, [lang]);

        const projectListNodes = useMemo(() => {
          return h(
            'ul',
            { className: 'record-list' },
            ACADEMIC_DATA.projects.map((proj) =>
              h(
                'li',
                { key: proj.id, className: 'record-row-wrapper' },
                h(
                  'div',
                  { className: 'row-labeled' },
                  h(
                    'span',
                    { className: 'cell-label' },
                    proj.href
                      ? h('a', { href: proj.href, target: '_blank', rel: 'noreferrer' }, proj.name)
                      : proj.name
                  ),
                  h('div', { className: 'cell-body' }, h('p', null, proj.desc[lang]))
                )
              )
            )
          );
        }, [lang]);

        const awardListNodes = useMemo(() => {
          return h(
            'ul',
            { className: 'record-list' },
            ACADEMIC_DATA.awards.map((aw) =>
              h(AwardRow, {
                key: aw.id,
                year: aw.year,
                title: aw.title[lang],
                badge: aw.badge ? aw.badge[lang] : undefined,
                issuer: aw.issuer[lang],
                highlight: aw.highlight
              })
            )
          );
        }, [lang]);

        const experienceListNodes = useMemo(() => {
          return h(
            React.Fragment,
            null,
            h(
              'ul',
              { className: 'record-list' },
              ACADEMIC_DATA.experience.map((exp) =>
                h(
                  'li',
                  { key: exp.id, className: 'record-row-wrapper' },
                  h(
                    'div',
                    { className: 'row-standard' },
                    h('span', { className: 'cell-time' }, exp.period),
                    h(
                      'div',
                      { className: 'cell-body' },
                      h('strong', { className: 'award-title' }, exp.title[lang]),
                      h('p', null, exp.detail[lang])
                    )
                  )
                )
              )
            ),
            h(
              'div',
              { className: 'credential-bar' },
              ACADEMIC_DATA.credentials.map((cred) =>
                h('span', { key: cred.id, className: 'credential-item' }, cred[lang])
              )
            )
          );
        }, [lang]);

        const contactListNodes = useMemo(() => {
          return h(
            'ul',
            { className: 'record-list' },
            ACADEMIC_DATA.contacts.map((ct) =>
              h(
                'li',
                { key: ct.id, className: 'record-row-wrapper' },
                h(
                  'div',
                  { className: 'row-labeled' },
                  h('span', { className: 'cell-label' }, ct.label),
                  h(
                    'div',
                    { className: 'cell-body' },
                    h(
                      'a',
                      {
                        href: ct.href,
                        target: ct.external ? '_blank' : undefined,
                        rel: ct.external ? 'noreferrer' : undefined
                      },
                      ct.value
                    )
                  )
                )
              )
            )
          );
        }, []);

        const currentYear = useMemo(() => new Date().getFullYear(), []);

        return h(
          'div',
          { className: 'page-shell' },
          h(SiteHeader, {
            lang: lang,
            theme: theme,
            activeSection: activeSection,
            onToggleLang: handleToggleLang,
            onToggleTheme: handleToggleTheme,
            onSelectSection: handleSelectSection
          }),
          h(
            'main',
            { className: 'main-content' },
            introContent,
            h(
              SectionFrame,
              { id: 'news', indexLabel: '01', title: lang === 'zh' ? '学术动态' : 'Recent News' },
              newsListNodes
            ),
            h(
              SectionFrame,
              { id: 'publications', indexLabel: '02', title: lang === 'zh' ? '代表性论文' : 'Selected Publications' },
              publicationListNodes
            ),
            h(
              SectionFrame,
              { id: 'research', indexLabel: '03', title: lang === 'zh' ? '研究方向与技术栈' : 'Research & Stack' },
              researchListNodes
            ),
            h(
              SectionFrame,
              { id: 'projects', indexLabel: '04', title: lang === 'zh' ? '科研平台与智能体项目' : 'Platforms & Agent Systems' },
              projectListNodes
            ),
            h(
              SectionFrame,
              { id: 'awards', indexLabel: '05', title: lang === 'zh' ? '荣誉与奖学金' : 'Honors & Scholarships' },
              awardListNodes
            ),
            h(
              SectionFrame,
              { id: 'experience', indexLabel: '06', title: lang === 'zh' ? '教育与实践经历' : 'Education & Experience' },
              experienceListNodes
            ),
            h(
              SectionFrame,
              { id: 'contact', indexLabel: '07', title: lang === 'zh' ? '联系方式' : 'Contact' },
              contactListNodes
            )
          ),
          h(
            'footer',
            { className: 'site-footer' },
            h(
              'div',
              { className: 'footer-flex' },
              h('span', null, `© ${currentYear} Zhuang Zhiyao · Ocean University of China`),
              h(
                'a',
                { className: 'back-top-link', href: '#top' },
                lang === 'zh' ? '返回顶部 ↑' : 'Back to top ↑'
              )
            )
          )
        );
      }

      const rootContainer = document.getElementById('root');
      const reactRoot = ReactDOM.createRoot(rootContainer);
      reactRoot.render(h(AcademicPortfolioApp));
    })();
  </script>
</body>
</html>
